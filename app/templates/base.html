<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SIGEC{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="navbar navbar-dark bg-dark px-3">
        <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}">SIGEC</a>

        {% if current_user.is_authenticated %}
        <div class="text-white">
            <span class="me-3">
                {{ current_user.nombre }} · {{ current_user.rol.nombre }}
            </span>
            <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">
                Cerrar sesión
            </a>
        </div>
        {% endif %}
    </header>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
